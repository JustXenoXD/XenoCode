[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenocode"
version = "0.1.0"
description = "A local-first multi-agent AI coding assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xenocode = "xenocode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["xenocode*"]
